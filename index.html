<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>MTEL 278 Math Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: graph-paper notebook. A hub of game cards, then one focused game "stage" card at a time. */
:root{
  --paper:#F4F7F5; --grid:rgba(30,60,90,.07); --ink:#16233B; --muted:#5B6A7D; --card:#FFFFFF; --line:#D5DEE6; --soft:#EAF0F4;
  --c1:#D9502B; --c2:#0B8F80; --c3:#C98A0B; --c4:#6A47B8; --c5:#2770C4; --c6:#C2306A; --c7:#3B7F2A;
  --ok:#17894F; --okbg:#E3F5EA; --bad:#C93838; --badbg:#FBE7E7; --hl:#FFF1C2;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E171D; --grid:rgba(160,200,230,.06); --ink:#E6EDF3; --muted:#9AAABB; --card:#16222B; --line:#2B3A46; --soft:#1D2C37;
  --c1:#FF7A55; --c2:#2CC7B2; --c3:#F0B73A; --c4:#A88BF0; --c5:#5EA2F2; --c6:#F06A9F; --c7:#79C35E;
  --ok:#46C783; --okbg:#173527; --bad:#FF6B6B; --badbg:#3A1D1F; --hl:#4A3F16; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0E171D; --grid:rgba(160,200,230,.06); --ink:#E6EDF3; --muted:#9AAABB; --card:#16222B; --line:#2B3A46; --soft:#1D2C37;
  --c1:#FF7A55; --c2:#2CC7B2; --c3:#F0B73A; --c4:#A88BF0; --c5:#5EA2F2; --c6:#F06A9F; --c7:#79C35E;
  --ok:#46C783; --okbg:#173527; --bad:#FF6B6B; --badbg:#3A1D1F; --hl:#4A3F16; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
#app{max-width:980px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c5);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.92em;margin:0 .08em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .18em}
sup{font-size:.65em;line-height:0}

/* ---------- hub */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:12px 22px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--c1)}
.hero p{max-width:60ch;color:var(--muted);margin:8px 0 0}
.tally{font-family:var(--mono);text-align:right;font-size:13px;color:var(--muted)}
.tally b{display:block;font-size:30px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.gcard{position:relative;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;transition:transform .15s,border-color .15s,box-shadow .15s}
.gcard:hover{transform:translateY(-2px);border-color:var(--acc);box-shadow:0 6px 0 -2px var(--acc)}
.gcard .ico{width:64px;height:64px;border-radius:12px;background:color-mix(in srgb,var(--acc) 14%,transparent);display:grid;place-items:center}
.gcard .ico svg{width:44px;height:44px}
.gcard .gname{display:block;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15;margin-bottom:2px}
.gcard .obj{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--acc);font-weight:700;text-transform:uppercase}
.gcard .gdesc{display:block;margin:4px 0 8px;color:var(--muted);font-size:14px}
.best{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:14px;height:14px}
.how{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;color:var(--muted);font-size:14px}
.how div{border-top:2px solid var(--line);padding-top:10px}
.how b{color:var(--ink);font-family:var(--display);font-size:16px;display:block}

/* ---------- game shell */
.gbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.back{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.back:hover{border-color:var(--ink)}
.gtitle{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}
.gtitle h2{font-size:26px}
.gtitle .obj{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--acc)}
.stats{display:flex;gap:14px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:16px}
.streak{color:var(--acc)!important;font-weight:700}
.progress{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--acc);transition:width .3s}
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:22px clamp(16px,3vw,28px)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:6px;padding:3px 8px;margin:0 0 10px}
.prompt{font-size:clamp(18px,2.4vw,22px);line-height:1.45;margin:0 0 14px}
.visual{display:flex;justify-content:center;margin:6px 0 16px;overflow-x:auto}
.visual svg{max-width:100%;height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:17px;min-height:54px}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;background:var(--soft);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.entry{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.entry input{font-family:var(--mono);font-size:22px;width:min(220px,100%);padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.entry input:focus{border-color:var(--acc);outline:none}
.entry .unit{font-family:var(--mono);color:var(--muted)}
.btn{border:none;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--acc);color:#fff;font-size:16px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.feedback{margin-top:14px;border-radius:16px;padding:18px 22px;border:1.5px solid var(--line);background:var(--card)}
.feedback.good{border-color:var(--ok)} .feedback.bad{border-color:var(--bad)}
.feedback h3{font-size:20px;margin-bottom:6px}
.feedback.good h3{color:var(--ok)} .feedback.bad h3{color:var(--bad)}
.feedback .ex{margin:0 0 12px;max-width:72ch}
.feedback .ex p{margin:.3em 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* forge */
.forge{display:grid;justify-items:center;gap:14px}
.ingot{font-family:var(--mono);font-weight:700;font-size:clamp(44px,9vw,72px);padding:6px 34px;border-radius:14px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 30%,var(--card)),color-mix(in srgb,var(--c1) 12%,var(--card)));
  border:2px solid var(--c1);min-width:200px;text-align:center}
.ingot.hit{animation:hit .25s}
.ingot.shake{animation:shake .3s}
@keyframes hit{50%{transform:scale(.9);filter:brightness(1.4)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;justify-content:center}
.chip{font-family:var(--mono);font-weight:700;font-size:18px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--c1);color:#fff;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}}
.hammers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hammer{font-family:var(--mono);font-weight:700;font-size:22px;width:62px;height:62px;border-radius:14px;border:2px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink)}
.hammer:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hammer:disabled{opacity:.4;cursor:default}
.toggles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tog{font-family:var(--mono);font-size:16px;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;background:var(--card)}
.tog[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tog.right{outline:3px solid var(--ok)} .tog.wrong{outline:3px solid var(--bad)}

/* sprint */
.sprint-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:34px;font-weight:700}
.clock.low{color:var(--bad)}
.mult{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--acc)}
.flash{animation:fl .5s}
@keyframes fl{0%{background:var(--okbg)}}
.flashbad{animation:fb .5s}
@keyframes fb{0%{background:var(--badbg)}}
.big-start{display:grid;justify-items:center;text-align:center;gap:12px;padding:20px 0}

/* number line */
.nl svg{touch-action:none;cursor:crosshair;user-select:none;width:100%;max-width:820px}
.target{font-size:clamp(30px,6vw,46px);font-weight:700;font-family:var(--mono);text-align:center;margin:4px 0 6px}

/* machine */
.machine{display:grid;grid-template-columns:auto auto auto;gap:14px;align-items:center;justify-content:center}
.mbox{position:relative;width:150px;height:110px;border-radius:14px;background:color-mix(in srgb,var(--acc) 16%,var(--card));border:2px solid var(--acc);display:grid;place-items:center;overflow:hidden}
.gear{animation:spin 4s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
.iotable{border-collapse:collapse;font-family:var(--mono);font-size:18px}
.iotable td,.iotable th{border:1.5px solid var(--line);padding:6px 14px;text-align:center}
.iotable th{background:var(--soft);font-size:13px}
.iotable .q{background:var(--hl);font-weight:700}

/* detective */
.paper{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 20px 16px 44px;position:relative;max-width:520px;width:100%;
  background-image:repeating-linear-gradient(transparent 0 29px,color-mix(in srgb,var(--c5) 22%,transparent) 29px 30px);background-position:0 10px}
.paper::before{content:"";position:absolute;left:32px;top:0;bottom:0;width:1.5px;background:color-mix(in srgb,var(--c6) 45%,transparent)}
.paper .who{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.paper .work{font-family:var(--hand);font-size:28px;line-height:30px;color:var(--c5);white-space:pre-wrap}

/* end */
.end{text-align:center;display:grid;gap:10px;justify-items:center}
.end .score{font-family:var(--display);font-size:64px;font-weight:800;line-height:1}
.end .stars svg{width:40px;height:40px}
.missed{text-align:left;width:100%;margin-top:18px;display:grid;gap:10px}
.missed details{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card)}
.missed summary{cursor:pointer;font-weight:700}
.missed .ex p{margin:.3em 0}

@media (max-width:560px){
  .hero{grid-template-columns:1fr}.tally{text-align:left}
  .machine{grid-template-columns:1fr;justify-items:center}
  .stats{width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
"use strict";
/* ================= utilities ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const prod=a=>a.reduce((x,y)=>x*y,1);
function num(n,dp=4){const r=+(+n).toFixed(dp);const s=Math.abs(r).toLocaleString("en-US",{maximumFractionDigits:dp});return (r<0?"−":"")+s}
function frac(n,d){if(d===1)return num(n);const neg=(n<0)!==(d<0)&&n!==0;return `${neg?"−":""}<span class="fr"><span>${Math.abs(n)}</span><span>${Math.abs(d)}</span></span>`}
function simp(n,d){const g=gcd(n,d)||1;if(d<0){n=-n;d=-d}return [n/g,d/g]}
function fracS(n,d){const [a,b]=simp(n,d);return frac(a,b)}
function mixed(n,d){const [a,b]=simp(n,d);if(b===1||Math.abs(a)<b)return frac(a,b);const w=Math.trunc(a/b),r=Math.abs(a%b);return `${w<0?"−":""}${Math.abs(w)} ${frac(r,b)}`}
const money=v=>"$"+(+v).toFixed(2);
const P=(...xs)=>xs.map(x=>`<p>${x}</p>`).join("");
function parseAns(s){
  s=String(s).replace(/−/g,"-").replace(/[,$%°]/g,"").trim().replace(/\s*[a-zA-Z]+\.?$/,"").trim();
  let m;
  if((m=s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/))){const v=+m[2]+ +m[3]/+m[4];return m[1]?-v:v}
  if((m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/)))return +m[1]/+m[2];
  if(/^-?\d*\.?\d+$/.test(s))return +s;
  return NaN;
}
function MC(o){const seen=new Set([o.correct]),w=[];for(const d of o.wrong){if(d==null||seen.has(d))continue;seen.add(d);w.push(d);if(w.length===3)break}
  const options=shuffle([o.correct,...w]);return Object.assign({kind:"mc"},o,{options,answer:options.indexOf(o.correct)})}
function NUM(o){return Object.assign({kind:"num",tol:1e-6},o)}

/* ================= SVG helpers ================= */
const S={
  svg:(w,h,inner,extra="")=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" ${extra} xmlns="http://www.w3.org/2000/svg" font-family="Atkinson Hyperlegible, system-ui, sans-serif">${inner}</svg>`,
  t:(x,y,s,o={})=>`<text x="${x}" y="${y}" font-size="${o.size||15}" fill="${o.fill||"var(--ink)"}" text-anchor="${o.anchor||"middle"}" font-weight="${o.weight||400}" ${o.mono?'font-family="JetBrains Mono, monospace"':""} dominant-baseline="middle">${s}</text>`,
  line:(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.stroke||"var(--ink)"}" stroke-width="${o.w||2}" ${o.dash?`stroke-dasharray="${o.dash}"`:""} stroke-linecap="round"/>`,
  poly:(pts,o={})=>`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${o.fill||"none"}" stroke="${o.stroke||"var(--ink)"}" stroke-width="${o.w||2}" ${o.dash?`stroke-dasharray="${o.dash}"`:""} stroke-linejoin="round"/>`,
  circ:(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.fill||"none"}" stroke="${o.stroke||"none"}" stroke-width="${o.w||2}"/>`,
};
/* fit math-coordinate points (y up) into a box */
function fit(pts,W,H,pad){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const k=Math.min((W-2*pad)/((maxx-minx)||1),(H-2*pad)/((maxy-miny)||1));const ox=(W-k*(maxx-minx))/2,oy=(H-k*(maxy-miny))/2;
  return pts.map(([x,y])=>[ox+(x-minx)*k,H-(oy+(y-miny)*k)])}
function inward(pts,i,dist){const p=pts[i],a=pts[(i+pts.length-1)%pts.length],b=pts[(i+1)%pts.length];
  const u=[a[0]-p[0],a[1]-p[1]],v=[b[0]-p[0],b[1]-p[1]];const nu=Math.hypot(...u),nv=Math.hypot(...v);const d=[u[0]/nu+v[0]/nv,u[1]/nu+v[1]/nv];const nd=Math.hypot(...d)||1;
  return [p[0]+d[0]/nd*dist,p[1]+d[1]/nd*dist]}
function sideLabel(pts,i,j,txt,off=16){const a=pts[i],b=pts[j];const cx=pts.reduce((s,p)=>s+p[0],0)/pts.length,cy=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];let n=[-(b[1]-a[1]),b[0]-a[0]];const nn=Math.hypot(...n);n=[n[0]/nn,n[1]/nn];
  if((m[0]+n[0]-cx)**2+(m[1]+n[1]-cy)**2<(m[0]-cx)**2+(m[1]-cy)**2)n=[-n[0],-n[1]];
  return S.t(m[0]+n[0]*off,m[1]+n[1]*off,txt,{weight:700,mono:true,size:15})}
function regular(n,r=1,rot=Math.PI/2){return Array.from({length:n},(_,i)=>[r*Math.cos(rot+2*Math.PI*i/n),r*Math.sin(rot+2*Math.PI*i/n)])}
function coordGrid(lo,hi,cell,inner){const n=hi-lo,W=n*cell+40,H=W,o=20;const X=x=>o+(x-lo)*cell,Y=y=>o+(hi-y)*cell;let g="";
  for(let i=lo;i<=hi;i++){g+=S.line(X(i),Y(lo),X(i),Y(hi),{stroke:"var(--line)",w:1});g+=S.line(X(lo),Y(i),X(hi),Y(i),{stroke:"var(--line)",w:1})}
  g+=S.line(X(0),Y(lo),X(0),Y(hi),{stroke:"var(--muted)",w:1.6})+S.line(X(lo),Y(0),X(hi),Y(0),{stroke:"var(--muted)",w:1.6});
  for(let i=lo;i<=hi;i+=2){if(i)g+=S.t(X(i),Y(0)+11,i,{size:10,fill:"var(--muted)"})+S.t(X(0)-10,Y(i),i,{size:10,fill:"var(--muted)"})}
  return S.svg(W,H,g+inner(X,Y))}

/* ================= GAME 1: FACTOR FORGE (011) ================= */
const PR=[2,3,5,7,11,13];
function factorize(n){const f={};for(const p of PR){while(n%p===0){f[p]=(f[p]||0)+1;n/=p}}return f}
function expForm(f){return Object.keys(f).map(Number).sort((a,b)=>a-b).map(p=>f[p]>1?`${p}<sup>${f[p]}</sup>`:`${p}`).join(" × ")}
function buildComposite(level){const pools={1:[2,2,3,3,5],2:[2,2,2,3,3,5,7],3:[2,2,3,3,5,7,11,13]};const cap={1:200,2:800,3:2400}[level];
  for(;;){const k=level===1?R(3,4):level===2?R(4,5):R(4,6);let n=1;for(let i=0;i<k;i++)n*=pick(pools[level]);if(n>=12&&n<=cap)return n}}
const DTIP={2:"Even numbers end in 0, 2, 4, 6 or 8.",3:"Add the digits. If the sum is divisible by 3, so is the number.",5:"Only numbers ending in 0 or 5 are divisible by 5.",7:"There's no quick rule for 7; try the division.",11:"For 11, alternately add and subtract the digits; the result must be divisible by 11.",13:"There's no quick rule for 13; try the division."};
function forgeRound(level){const N=buildComposite(level);return{kind:"custom",tag:"Prime factorization",
  prompt:`Smash <b class="num">${N}</b> into primes. Strike it with a prime that divides it evenly.`,
  mount(stage,done){let cur=N,wrong=0;
    stage.innerHTML=`<div class="forge"><div class="ingot" id="ingot">${N}</div><div class="chips" id="chips" aria-live="polite"></div>
      <div class="hammers">${PR.map(p=>`<button class="hammer" data-p="${p}">${p}</button>`).join("")}</div><p class="hint" id="fhint">A wrong strike costs 20 points.</p></div>`;
    const ing=stage.querySelector("#ingot"),chips=stage.querySelector("#chips"),hint=stage.querySelector("#fhint");
    stage.querySelectorAll(".hammer").forEach(b=>b.onclick=()=>{const p=+b.dataset.p;ing.classList.remove("hit","shake");void ing.offsetWidth;
      if(cur%p===0){cur/=p;chips.insertAdjacentHTML("beforeend",`<span class="chip">${p}</span>`);ing.textContent=cur;ing.classList.add("hit");hint.textContent=cur===1?"Fully forged!":`${cur*p} ÷ ${p} = ${cur}`;
        if(cur===1){stage.querySelectorAll(".hammer").forEach(h=>h.disabled=true);const pts=Math.max(20,100-20*wrong);
          done({points:pts,max:100,correct:wrong===0,answer:`${N} = ${expForm(factorize(N))}`,
            explain:P(`${N} = ${expForm(factorize(N))}`,wrong?`You had ${wrong} wrong strike${wrong>1?"s":""}. Test small primes first: 2, then 3, then 5.`:"No wrong strikes.","Every whole number greater than 1 has exactly one prime factorization (the Fundamental Theorem of Arithmetic). The order you find the primes in doesn't matter.")})}}
      else{wrong++;ing.classList.add("shake");hint.textContent=`${cur} ÷ ${p} isn't a whole number. ${DTIP[p]}`}})}}}
function vennRound(){let s,a,b;
  for(;;){s=Array.from({length:R(1,2)},()=>pick([2,3,5]));a=Array.from({length:R(1,2)},()=>pick([2,3,5,7]));b=Array.from({length:R(1,2)},()=>pick([2,3,5,7,11]));
    if(a.some(p=>b.includes(p)))continue;const A=prod(s)*prod(a),B=prod(s)*prod(b);if(A!==B&&A<=300&&B<=300&&A>=6&&B>=6)break}
  const A=prod(s)*prod(a),B=prod(s)*prod(b),G=gcd(A,B),L=lcm(A,B);
  const ask=pick(["GCF","LCM"]);const correct=ask==="GCF"?G:L;
  const wrong=ask==="GCF"?[L,Math.min(A,B),G*pick([2,3]),1,G*2]:[A*B,G,Math.max(A,B),L*2,L/ (pick(s))];
  const tok=(arr,cx)=>arr.slice().sort((x,y)=>x-y).map((p,i,all)=>`<circle cx="${cx}" cy="${100-(all.length-1)*14+i*28}" r="13" fill="var(--c1)"/><text x="${cx}" y="${100-(all.length-1)*14+i*28}" fill="#fff" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace">${p}</text>`).join("");
  const venn=S.svg(360,210,`<circle cx="140" cy="105" r="88" fill="color-mix(in srgb,var(--c1) 10%,transparent)" stroke="var(--c1)" stroke-width="2"/><circle cx="220" cy="105" r="88" fill="color-mix(in srgb,var(--c5) 10%,transparent)" stroke="var(--c5)" stroke-width="2"/>${S.t(110,10,`${A}`,{weight:700,mono:true})}${S.t(250,10,`${B}`,{weight:700,mono:true})}<g transform="translate(0,5)">${tok(a,92)}${tok(s,180)}${tok(b,268)}</g>`);
  return MC({tag:"GCF and LCM",prompt:`${A} = ${expForm(factorize(A))} and ${B} = ${expForm(factorize(B))}.<br>What is the <b>${ask==="GCF"?"greatest common factor":"least common multiple"}</b> of ${A} and ${B}?`,
    correct:num(correct),wrong:wrong.map(num),
    explain:P(`GCF = product of the <b>shared</b> primes (the middle of the Venn diagram) = <b>${G}</b>. LCM = product of <b>every</b> prime in the diagram = <b>${L}</b>.`,`Check: GCF × LCM = ${G} × ${L} = ${G*L} = ${A} × ${B}.`)+`<div class="visual">${venn}</div>`,
    answer:num(correct)})}
function divRound(){let N;do{N=pick([12,18,24,30,36,45,60,72,90,15,40])*R(30,600)}while(N<1000||N>9999);
  const ds=[2,3,4,5,6,9,10];const truth=ds.filter(d=>N%d===0);const digits=String(N).split("").map(Number);const sum=digits.reduce((a,b)=>a+b,0);
  return{kind:"custom",tag:"Divisibility rules",prompt:`Tap every number that divides <b class="num">${N.toLocaleString("en-US")}</b> evenly. No calculator!`,
    mount(stage,done){stage.innerHTML=`<div class="forge"><div class="ingot">${N.toLocaleString("en-US")}</div><div class="toggles">${ds.map(d=>`<button class="tog" aria-pressed="false" data-d="${d}">÷ ${d}</button>`).join("")}</div><button class="btn" id="chk">Check</button></div>`;
      stage.querySelectorAll(".tog").forEach(t=>t.onclick=()=>t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")==="true"?"false":"true"));

        done({points:Math.round(100*ok/7),max:100,correct:ok===7,answer:`÷ ${truth.join(", ")}`,
          explain:P(`${N.toLocaleString("en-US")} is divisible by <b>${truth.join(", ")||"none of these"}</b>.`,
            `Digit sum: ${digits.join(" + ")} = ${sum}. ${sum%3===0?"It's":"It's not"} divisible by 3${sum%9===0?" and 9":""}, so ${N} ${sum%3===0?"is":"isn't"} divisible by 3${sum%9===0?" and 9":sum%3===0?" (but not 9)":""}.`,
            `Last two digits: ${String(N).slice(-2)}. ${(N%100)%4===0?"Divisible by 4, so the number is too.":"Not divisible by 4, so the number isn't either."}`,
            `Last digit: ${N%10}. That decides 2, 5 and 10. And 6 needs both 2 and 3.`)})}}}}

const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};

const sprintGens={
  order(){const t=R(1,5);let a=R(2,9),b=R(2,9),c=R(2,6),d=R(2,5),e,c1,w;
    if(t===1){e=`${a} + ${b} × ${c}`;c1=a+b*c;w=[(a+b)*c,a+b+c,a*b+c]}
    else if(t===2){b=c*R(2,6);const A=a+b;e=`${A} − ${b} ÷ ${c}`;c1=A-b/c;w=[(A-b)%c===0?(A-b)/c:null,A-b-c,b/c,A-b]}
    else if(t===3){e=`${a} + ${b}${sup(2)} × 2`;c1=a+b*b*2;w=[(a+b)**2*2,a+b*2*2,(a+b*b)*2]}
    else if(t===4){e=`(${a} + ${b}) × ${c} − ${d}`;c1=(a+b)*c-d;w=[a+b*c-d,(a+b)*(c-d),a+b*(c-d)]}
    else{b=R(3,9);c=R(2,8);a=b+R(5,12);e=`${a} − ${b} + ${c}`;c1=a-b+c;w=[a-(b+c),a+b+c,a-b-c]}
    return MC({tag:"Order of operations",prompt:`<span class="num">${e}</span> = ?`,correct:num(c1),wrong:w.concat([c1+R(1,4),c1-R(1,4)]).filter(x=>x!=null&&Number.isFinite(x)).map(num),
      explain:t===5?"Addition and subtraction have equal rank: work left to right. Subtracting first is correct here.":"Parentheses, then exponents, then multiplication and division (left to right), then addition and subtraction (left to right)."})},
  place(){for(;;){const ds=[R(1,9),R(0,9),R(0,9),R(0,9),R(0,9),R(0,9),R(1,9)];const pos=R(0,6);const dg=ds[pos];if(!dg||ds.filter(x=>x===dg).length>1)continue;
    const str=`${ds.slice(0,5).join("")}.${ds.slice(5).join("")}`;const ex=4-pos;const val=dg*10**ex;
    return MC({tag:"Place value",prompt:`In <span class="num">${(+ds.slice(0,5).join("")).toLocaleString("en-US")}.${ds.slice(5).join("")}</span>, what is the value of the digit <b>${dg}</b>?`,
      correct:num(val,4),wrong:[num(val*10,4),num(val/10,4),String(dg),num(val*100,4)],explain:`The ${dg} is in the ${["ten-thousands","thousands","hundreds","tens","ones","tenths","hundredths"][pos]} place, so its value is ${num(val,4)}.`})}},
  props(){const a=R(2,9),b=R(2,9),c=R(2,9);const items=[
      [`${a} × (${b} + ${c}) = ${a} × ${b} + ${a} × ${c}`,"Distributive"],[`(${a} + ${b}) + ${c} = ${a} + (${b} + ${c})`,"Associative"],
      [`${a} × ${b} = ${b} × ${a}`,"Commutative"],[`${a+b} + 0 = ${a+b}`,"Identity"],[`(${a} × ${b}) × ${c} = ${a} × (${b} × ${c})`,"Associative"],
      [`${a} + ${b} = ${b} + ${a}`,"Commutative"],[`${a*b} × 1 = ${a*b}`,"Identity"],[`${a} + (−${a}) = 0`,"Inverse"]];const [eq,ans]=pick(items);
    return MC({tag:"Properties",prompt:`Which property does this show?<br><span class="num">${eq}</span>`,correct:`${ans} property`,wrong:shuffle(["Distributive","Associative","Commutative","Identity","Inverse"].filter(x=>x!==ans)).map(x=>x+" property"),
      explain:{Distributive:"Multiplying a sum equals multiplying each part and adding.",Associative:"The grouping (parentheses) changes, but the order doesn't.",Commutative:"The order of the numbers changes.",Identity:"Adding 0 or multiplying by 1 leaves the number unchanged.",Inverse:"A number plus its opposite is 0."}[ans]})},
  integers(){const a=R(2,15),b=R(2,15);const t=R(1,5);let e,c,w;

  sci(){if(Math.random()<.5){const m=R(11,99)/10,e=-R(2,5);const val=m*10**e;const s=val.toFixed(-e+1).replace(/0+$/,"");

  estimate(){const a=R(2,9)*100+pick([-3,-2,-1,1,2,3]),b=R(2,9)*10+pick([-1,1,2,-2]);const est=Math.round(a/100)*100*Math.round(b/10)*10;

function lineQ(){const f=pick(["frac","frac","mixed","dec","pct","op","op","neg"]);let v,label,explain,min=0,max=2;
  if(f==="frac"){const d=pick([3,4,5,6,8,10,12]);let n;do{n=R(1,2*d-1)}while(n%d===0);v=n/d;label=frac(n,d);explain=`${frac(n,d)} = ${n} ÷ ${d} ≈ ${num(v,3)}.${n>d?` It's more than 1 because the numerator is bigger than the denominator.`:""}`}
  else if(f==="mixed"){const d=pick([3,4,5,8,6]);let n;do{n=R(1,d-1)}while(gcd(n,d)>1);v=1+n/d;label=`1 ${frac(n,d)}`;explain=`1 ${frac(n,d)} = 1 + ${num(n/d,3)} ≈ ${num(v,3)}.`}
  else if(f==="dec"){v=pick([.15,.35,.6,.875,1.2,1.25,1.4,1.65,1.8,.05,1.05,.45,1.125]);label=String(v);const [a,b]=simp(Math.round(v*1000),1000);explain=`${v} = ${frac(a,b)}.`}
  else if(f==="pct"){const p=pick([5,20,35,40,60,75,90,110,125,150,175,140]);v=p/100;label=`${p}%`;const [a,b]=simp(p,100);explain=`${p}% means ${p} per hundred: ${p}/100 = ${frac(a,b)} = ${num(v,3)}.`}
  else if(f==="neg"){min=-1;max=1;const d=pick([3,4,5,8,10]);const n=R(1,d-1);if(Math.random()<.5){v=-n/d;label=frac(-n,d)}else{v=-Math.round(n/d*100)/100;label=num(v,2)}explain=`${label} is ${num(Math.abs(v),3)} to the <b>left</b> of 0. Negative numbers sit on the opposite side of zero.`}
  else{for(;;){const a=R(1,7),b=pick([2,3,4,5,6,8]),c=R(1,7),d=pick([2,3,4,5,6,8]);if(a>=b*2||c>=d*2)continue;const op=pick(["×","+","÷","−"]);let n,m;
      if(op==="×"){n=a*c;m=b*d}else if(op==="+"){n=a*d+c*b;m=b*d}else if(op==="−"){n=a*d-c*b;m=b*d}else{n=a*d;m=b*c}
      const val=n/m;if(val<=.04||val>=1.96)continue;const [sn,sd]=simp(n,m);if(sd>24)continue;v=val;label=`${frac(a,b)} ${op} ${frac(c,d)}`;
      explain=op==="×"?`Multiply across: ${frac(a*c,b*d)} = ${frac(sn,sd)} ≈ ${num(v,3)}.`:op==="÷"?`Multiply by the reciprocal: ${frac(a,b)} × ${frac(d,c)} = ${frac(a*d,b*c)} = ${frac(sn,sd)} ≈ ${num(v,3)}.${v>a/b?" Dividing by a fraction less than 1 makes the result bigger.":""}`:(()=>{const cd=lcm(b,d);return `Use a common denominator of ${cd}: ${frac(a*cd/b,cd)} ${op} ${frac(c*cd/d,cd)} = ${frac(n*cd/m,cd)}${n*cd/m!==sn||cd!==sd?" = "+frac(sn,sd):""} ≈ ${num(v,3)}.`})();break}}
  return{kind:"line",tag:f==="op"?"Fraction operations":f==="neg"?"Negative rationals":"Fractions, decimals, percents",prompt:"Drop the pin where this number belongs.",label,value:v,min,max,explain:P(explain)}}

const CASES=[

  {topic:"Order of operations",work:"8 − 3 + 2\n= 8 − 5\n= 3",q:"What is the error?",c:"Thinks addition must come before subtraction (reading PEMDAS too literally)",w:["Forgot that subtraction is commutative","Should have multiplied first","There is no error"],ex:"Addition and subtraction have the same rank, so you go left to right: 8 − 3 = 5, then 5 + 2 = 7."},
  {topic:"Subtraction",work:"  52\n− 27\n  35",q:"What is this student's misconception?",c:"Subtracts the smaller digit from the larger in each column instead of regrouping",w:["Added instead of subtracting","Lined up the place values wrong","Regrouped twice"],ex:"In the ones column, 2 − 7 needs regrouping: 12 − 7 = 5, then 4 − 2 = 2, so the answer is 25. The student did 7 − 2."},
  {topic:"Equal sign",work:"8 + 4 = __ + 5\n8 + 4 = 12 + 5",q:"What does this student think the equal sign means?",c:"\"Write the answer\" instead of \"is the same amount as\"",w:["\"Greater than\"","\"Add everything together\"","The student understands it correctly"],ex:"The blank should be 7, so both sides equal 12. Balance-scale activities and true/false equations like 7 = 7 or 5 + 2 = 3 + 4 build the relational meaning."},
  {topic:"Area and perimeter",work:"Rectangle 6 by 4\nArea = 6 + 4 + 6 + 4 = 20",q:"What did the student find?",c:"The perimeter, not the area",w:["The volume","Half the area","The diagonal"],ex:"Area = 6 × 4 = 24 square units, the number of squares inside. Perimeter = 20 units, the distance around. Covering the shape with square tiles helps."},
  {topic:"Geometry",work:"A square is NOT a rectangle.\nIt doesn't look like one.",q:"Which description best fits this student's thinking?",c:"Judges shapes by how they look, not by their properties (van Hiele visual level)",w:["Reasons with formal proofs (van Hiele deduction level)","Understands class inclusion","Confuses area with perimeter"],ex:"At the visual level, students recognize shapes by appearance. Sorting by properties (4 right angles) moves them toward seeing that a square has every property of a rectangle."},
  {topic:"Median",work:"Data: 7, 2, 9, 4, 5\nMedian = 9",q:"What did the student do wrong?",c:"Took the middle value without putting the data in order first",w:["Found the mean instead","Found the mode instead","Used the range"],ex:"Ordered: 2, 4, 5, 7, 9, so the median is 5."},
  {topic:"Probability",work:"I flipped heads 4 times in a row,\nso tails is more likely next.",q:"What is the misconception?",c:"Thinks past results change the chance of the next independent event",w:["Thinks heads and tails are not equally likely","Confuses probability with odds","Thinks a coin has three outcomes"],ex:"This is the gambler's fallacy. Each flip is independent; P(tails) is still 1/2."},
  {topic:"Decimal multiplication",work:"0.4 × 0.2 = 0.8",q:"What is the error?",c:"Placed the decimal point as if adding, instead of counting decimal places in both factors",w:["Multiplied 4 × 2 incorrectly","Should have added the numbers","There is no error"],ex:"0.4 × 0.2 = 0.08 (tenths × tenths = hundredths). An area model on a 10 × 10 grid shows this: 4 tenths of 2 tenths is 8 hundredths."},

function mountLine(q,area,finish){const W=640,H=150,x0=40,x1=600,y=88;const X=v=>x0+(v-q.min)/(q.max-q.min)*(x1-x0);let t="";

  const svg=area.querySelector("#nl"),pin=area.querySelector("#pin"),lock=area.querySelector("#lock");let g=null,done=false;
  const set=v=>{g=Math.max(q.min,Math.min(q.max,v));pin.style.display="";pin.setAttribute("transform",`translate(${X(g)},0)`);lock.disabled=false};
  const at=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;return q.min+(px-x0)/(x1-x0)*(q.max-q.min)};
  let drag=false;svg.addEventListener("pointerdown",e=>{if(done)return;drag=true;svg.setPointerCapture(e.pointerId);set(at(e))});svg.addEventListener("pointermove",e=>{if(drag&&!done)set(at(e))});svg.addEventListener("pointerup",()=>drag=false);
  svg.addEventListener("keydown",e=>{if(done)return;const st=(q.max-q.min)/200;if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();set((g??(q.min+q.max)/2)+(e.key==="ArrowRight"?st:-st))}});
  lock.onclick=()=>{done=true;lock.disabled=true;const err=Math.abs(g-q.value)/(q.max-q.min);const pts=Math.round(Math.max(0,100-err*1000));
    const tx=X(q.value),rt=tx>W/2;area.querySelector("#truth").innerHTML=`<line x1="${tx}" x2="${tx}" y1="${y-6}" y2="${y+38}" stroke="var(--ok)" stroke-width="3"/><circle cx="${tx}" cy="${y+42}" r="7" fill="var(--ok)"/>`+S.t(rt?tx-14:tx+14,y+43,"actual: "+num(q.value,3),{size:15,weight:700,fill:"var(--ok)",anchor:rt?"end":"start"});
    finish({points:pts,max:100,correct:err<=.02,answer:`${q.label} ≈ ${num(q.value,3)}`,explain:P(err<=.02?"Bullseye! You were within 2% of the line.":`You placed it at about ${num(g,2)}. Off by ${num(Math.abs(g-q.value),2)}.`)+q.explain})};
  keyHandler=e=>{if(e.key==="Enter"&&!lock.disabled){e.preventDefault();lock.click()}}}

function playSprint(g){shell(g,`<span>Best <b>${(loadBest()[g.id]||{}).score||0}</b></span>`);const body=document.getElementById("body");
  body.innerHTML=`<section class="stage big-start"><div class="tag">75 seconds</div><h2 style="font-size:32px">Ready?</h2><p style="max-width:52ch;color:var(--muted)">Answer as many as you can. Each right answer scores 10 × your multiplier. Three in a row raises the multiplier (up to ×4). A wrong answer resets it and costs 3 seconds.</p><button class="btn" id="go">Start the clock</button></section>`;
  body.querySelector("#go").onclick=start;keyHandler=e=>{if(e.key==="Enter"){e.preventDefault();start()}};
  function start(){clearInterval(activeTimer);let time=75,score=0,streak=0,mult=1,right=0,total=0;const missed=[];const gens=Object.values(sprintGens);let lastGen=null;
    body.innerHTML=`<div class="sprint-top"><span class="clock" id="clk">75</span><span class="mult" id="mul">×1</span><span class="stats"><span>Score <b id="sc">0</b></span><span>Right <b id="rt">0</b></span></span></div><section class="stage" id="st"></section>`;
    const st=body.querySelector("#st");const tick=setInterval(()=>{time--;upd();if(time<=0)over()},1000);activeTimer=tick;
    const upd=()=>{const c=body.querySelector("#clk");if(!c)return;c.textContent=Math.max(0,time);c.classList.toggle("low",time<=10);body.querySelector("#mul").textContent="×"+mult;body.querySelector("#sc").textContent=score;body.querySelector("#rt").textContent=right};
    function nextQ(){let gen;do{gen=pick(gens)}while(gen===lastGen);lastGen=gen;const q=gen();
      st.innerHTML=`<p class="tag">${q.tag}</p><div class="prompt">${q.prompt}</div><div class="opts">${q.options.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${j+1}</span><span>${o}</span></button>`).join("")}</div>`;
      const bs=[...st.querySelectorAll(".opt")];const choose=j=>{if(time<=0)return;bs.forEach(b=>b.disabled=true);total++;
        if(j===q.answer){right++;streak++;score+=10*mult;if(streak%3===0&&mult<4)mult++;bs[j].classList.add("right");st.classList.remove("flash","flashbad");void st.offsetWidth;st.classList.add("flash")}
        else{streak=0;mult=1;time=Math.max(0,time-3);missed.push(q);bs[j].classList.add("wrong");bs[q.answer].classList.add("right");st.classList.remove("flash","flashbad");void st.offsetWidth;st.classList.add("flashbad")}
        upd();setTimeout(()=>{if(time>0)nextQ();else over()},j===q.answer?350:1100)};
      bs.forEach(b=>b.onclick=()=>choose(+b.dataset.j));keyHandler=e=>{const k=+e.key;if(k>=1&&k<=bs.length){e.preventDefault();choose(k-1)}}}
    let ended=false;function over(){if(ended)return;ended=true;clearInterval(tick);keyHandler=null;const stars=right>=20?3:right>=12?2:right>=6?1:0;saveBest(g.id,score,stars);
      body.innerHTML=`<section class="stage end"><div class="eyebrow">Time!</div><div class="score">${score}</div>${starsHTML(stars)}<p>${right} right out of ${total}. Stars: 6, 12 and 20 right answers.</p>
        <div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home">Back to arcade</button></div>
        ${missed.length?`<div class="missed"><h3>Review what you missed</h3>${missed.map(q=>`<details><summary>${q.tag}</summary><div class="prompt" style="font-size:17px">${q.prompt}</div><p><b>Answer:</b> ${q.options[q.answer]}</p><div class="ex">${P(q.explain)}</div></details>`).join("")}</div>`:""}</section>`;
      body.querySelector("#again").onclick=()=>playSprint(g);body.querySelector("#home").onclick=()=>{location.hash=""}}
    nextQ();upd()}}

let activeTimer=null;
function route(){keyHandler=null;clearInterval(activeTimer);const id=location.hash.slice(1);const g=GAMES.find(x=>x.id===id);window.scrollTo(0,0);if(g)play(g);else hub()}
if(typeof document!=="undefined"&&document.getElementById("app")){window.addEventListener("hashchange",route);route()}
</script>

</body>
